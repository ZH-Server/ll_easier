name: Pack LeviLamina

on:
  workflow_dispatch:
    inputs:
      LL_VER:
        description: 'LeviLamina version'
        required: true
        default: '0.13.5'
        type: string
      LSE:
        description: 'Include LSE'
        required: false
        default: false
        type: boolean
      RUNTIME:
        description: 'Include runtime for LeviLamina'
        required: false
        default: false
        type: boolean
      SCRIPTS:
        description: 'Use user_scripts'
        required: false
        default: false
        type: boolean

jobs:
  Pack:
    permissions:
      contents: write
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:    
    - name: 💡 Check Out Repo
      uses: actions/checkout@v4
      
    - name: 🔄 Cache Dependencies
      uses: actions/cache@v4
      with:
        path: |
          scripts/lip.zip
          scripts/7z_installer.exe
        key: ${{ runner.os }}-deps-${{ hashFiles('**/scripts/*') }}

    - name: 🛠️ Install Lip & Prepare Environment
      run: |
        try {
          New-Item -ItemType Directory -Force -Path ll, scripts | Out-Null
          Move-Item -Path .\LICENSE -Destination .\ll\LL_Easier_LICENSE -Force
          
          if (-not (Test-Path .\scripts\lip.zip)) {
            Invoke-WebRequest -Uri https://github.com/futrime/lip/releases/latest/download/lip-cli-win-x64.zip -OutFile .\scripts\lip.zip
          }
          if (-not (Test-Path .\scripts\7z_installer.exe)) {
            Invoke-WebRequest -Uri https://www.7-zip.org/a/7z2401-x64.exe -OutFile .\scripts\7z_installer.exe
          }
          
          Expand-Archive -Path .\scripts\lip.zip -DestinationPath .\scripts\ -Force
          Start-Process -Wait -FilePath .\scripts\7z_installer.exe -ArgumentList '/S'
          
          "$env:GITHUB_WORKSPACE\scripts" | Out-File -FilePath $env:GITHUB_PATH -Append
        }
        catch {
          Write-Error "Environment setup failed: $_"
          exit 1
        }

    - name: 🧰 Install LeviLamina
      working-directory: ll
      run: |
        try {
          lip.exe install github.com/LiteLDev/LeviLamina@${{ inputs.LL_VER }}
        }
        catch {
          Write-Error "LeviLamina installation failed: $_"
          exit 1
        }
    
    - name: ⚙️ Install LSE
      if: inputs.LSE
      working-directory: ll
      run: |
        $engines = @(
          'gitea.litebds.com/LiteLDev/legacy-script-engine-python',
          'gitea.litebds.com/LiteLDev/legacy-script-engine-lua',
          'gitea.litebds.com/LiteLDev/legacy-script-engine-quickjs'
        )
        
        foreach ($engine in $engines) {
          try {
            lip.exe install $engine
          }
          catch {
            Write-Error "Failed to install $engine : $_"
            exit 1
          }
        }
    
    - name: 🔧 Install Runtime
      if: inputs.RUNTIME
      working-directory: ll
      run: |
        try {
          Invoke-WebRequest -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe -OutFile .\runtime_for_levilamina.exe
        }
        catch {
          Write-Error "Runtime download failed: $_"
          exit 1
        }
    
    - name: 📜 Run User's Scripts
      if: inputs.SCRIPTS
      working-directory: ll
      run: |
        if (Test-Path user_scripts.ps1) {
          try {
            pwsh user_scripts.ps1
          }
          catch {
            Write-Error "User scripts execution failed: $_"
            exit 1
          }
        }
        else {
          Write-Warning "user_scripts.ps1 not found, skipping..."
        }

    - name: 📂 Remove BDS & Get BDS Version
      id: get_bds_core_version
      working-directory: ll
      run: |
        try {
          $res = Get-content -Raw -Path "./.lip/metadata/github.com%2FLiteLDev%2Fbds.json" | ConvertFrom-Json
          "bds_core_version=$($res.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          
          $itemsToRemove = @(
            '.\behavior_packs', '.\definitions', '.\resource_packs',
            '.\bedrock_*', '.\config', '.\.cache',
            '.\allowlist.json', '.\bdsdown.exe',
            '.\permissions.json', '.\release-notes.txt',
            '.\server.properties'
          )
          
          foreach ($item in $itemsToRemove) {
            Remove-Item -Path $item -Force -Recurse -ErrorAction SilentlyContinue
          }
        }
        catch {
          Write-Error "Failed to process BDS files: $_"
          exit 1
        }
    
    - name: 📦 Pack Files
      run: |
        try {
          7z a "ll_${{ inputs.LL_VER }}-bds_${{ steps.get_bds_core_version.outputs.bds_core_version }}.zip" .\ll\
        }
        catch {
          Write-Error "Failed to create archive: $_"
          exit 1
        }

    - name: 🎉 Upload Release
      uses: softprops/action-gh-release@v1
      with:
        files: ll_${{ inputs.LL_VER }}-bds_${{ steps.get_bds_core_version.outputs.bds_core_version }}.zip
        name: LeviLamina Packed - ${{ inputs.LL_VER }} (Legacy)
        tag_name: ${{ inputs.LL_VER }}
        body: |
          LeviLamina version: ${{ inputs.LL_VER }}
          BDS core needed version: ${{ steps.get_bds_core_version.outputs.bds_core_version }}
          Include LSE: ${{ inputs.LSE }}
          Include Runtime: ${{ inputs.RUNTIME }}
          Use user_scripts: ${{ inputs.SCRIPTS }}
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
